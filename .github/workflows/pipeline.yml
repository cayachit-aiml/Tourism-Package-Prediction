
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ======================================================
  # JOB 1: REGISTER DATASET
  # ======================================================

  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r tourism_project/requirements.txt

      - name: Register Dataset
        run: |
          python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv


  # ======================================================
  # JOB 2: DATA PREPARATION
  # ======================================================

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r tourism_project/requirements.txt

      - name: Run Data Preparation
        run: |
          python tourism_project/model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/model_building/data_splits/Xtrain.csv
            tourism_project/model_building/data_splits/Xtest.csv
            tourism_project/model_building/data_splits/ytrain.csv
            tourism_project/model_building/data_splits/ytest.csv


  # ======================================================
  # JOB 3: MODEL TRAINING AND MLFLOW TRACKING
  # ======================================================

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Verify MLflow Installation
        run: |
          python -c "import mlflow; print('MLflow version:', mlflow.__version__)"

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/model_building/data_splits

      # Start MLflow tracking server

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/health > /dev/null; then
              echo "MLflow server started successfully."
              break
            fi
            sleep 2
          done

      - name: Model Building
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python tourism_project/model_building/train.py

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/best_tourism_model.joblib

          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"

          git push
